# =============================================================================
# kinekit example configuration.
#
# Copy this file to `config.toml` and edit. Lines starting with `#` are
# comments. Every commented-out key below shows its built-in default —
# uncomment only the ones you actually want to override.
#
# Loaded by kinegram and kinemetry. Unknown keys are ignored.
# =============================================================================

# -----------------------------------------------------------------------------
# Camera
# -----------------------------------------------------------------------------
[camera]
#width  = 1920
#height = 1080
#fps    = 30

# -----------------------------------------------------------------------------
# Autofocus (Camera Module v3 / v3 NoIR / equivalent only)
# -----------------------------------------------------------------------------
[autofocus]
#enabled = true
#mode    = 2   # 0=Auto, 1=Manual, 2=Continuous
#speed   = 1   # 0=Normal, 1=Fast
#range   = 2   # 0=Normal, 1=Macro, 2=Full

# -----------------------------------------------------------------------------
# Motion detection
# -----------------------------------------------------------------------------
[motion_detection]
#enabled                  = true
#frame_skip               = 7      # frames between motion checks (CPU/latency tradeoff)
#pixel_change_sensitivity = 25.0   # per-pixel brightness delta threshold (0–255)
#min_object_size          = 0.05   # min changed fraction of frame to trigger (0.0–1.0)

# -----------------------------------------------------------------------------
# MJPEG / JPEG burst photos
# -----------------------------------------------------------------------------
[mjpeg]
#enabled                            = true
#output_enabled                     = true
#encode_interval_ms                 = 1000
#burst_photo_count                  = 1
#max_burst_packets_during_recording = 3

# -----------------------------------------------------------------------------
# H.264 video encoding
# -----------------------------------------------------------------------------
[h264]
#enabled        = true
#output_enabled = true
#gop_size       = 60
#bitrate        = 5000000   # bits per second
#cbr            = false     # constant bitrate (true) vs variable (false)
#sps_pps_repeat = true

# -----------------------------------------------------------------------------
# Telegram bot (kinegram only)
# -----------------------------------------------------------------------------
[telegram]
#enabled        = true
bot_token      = "YOUR_BOT_TOKEN_HERE"
chat_id        = "YOUR_CHAT_ID_HERE"
#max_queue_size = 5

# -----------------------------------------------------------------------------
# TCP streaming
# -----------------------------------------------------------------------------
[tcp]
#format = "h264"   # "h264" | "mjpeg"

[tcp.broadcast]
#enabled     = true
#port        = 8554
#max_clients = 5

[tcp.client]
#enabled                = false
#remote_ip              = "10.0.0.2"
#remote_port            = 9999
#reconnect_interval_sec = 1

# -----------------------------------------------------------------------------
# Video recording on motion
# -----------------------------------------------------------------------------
[video_recording]
#enabled            = true
#duration_sec       = 30
#preroll_sec        = 3
#tail_duration      = 5
#max_memory_mb      = 20
#failed_videos_dir  = "/home/pi/recordings/failed"
#max_failed_files   = 50
#retry_interval_sec = 2
#max_retries        = 2
#send_to_telegram   = true
